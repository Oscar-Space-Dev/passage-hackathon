services:
  - type: web
    name: passage-hackathon
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PASSAGE_DB
        value: /tmp/passage.db
      - key: PASSAGE_REQUIRE_REMOTE_DB
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PASSAGE_ENCRYPTION_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PASSAGE_PUBLIC_SIGNUP
        value: "1"
